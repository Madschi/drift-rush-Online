<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>Drift Rush Online V51</title>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap');
        
        body { margin: 0; overflow: hidden; background: #050505; font-family: 'Orbitron', sans-serif; user-select: none; }
        
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
        
        #hud { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        
        #speedometer { position: absolute; bottom: 30px; right: 30px; text-align: right; }
        #speed-val { font-size: 5em; color: #fff; font-weight: 900; line-height: 0.8; text-shadow: 0 0 20px #00eaff; }
        #speed-unit { font-size: 1.2em; color: #00eaff; letter-spacing: 2px; }
        
        /* PUNKTE SYSTEM UI */
        #leaderboard {
            position: absolute; top: 20px; right: 20px;
            background: rgba(0, 20, 40, 0.8); border: 2px solid #00eaff;
            border-radius: 8px; width: 250px; padding: 10px;
            font-family: 'Roboto'; color: #fff;
            box-shadow: 0 0 20px rgba(0, 234, 255, 0.2);
        }
        .lb-header { border-bottom: 1px solid #555; padding-bottom: 5px; margin-bottom: 5px; font-weight: bold; color: #00eaff; font-family: 'Orbitron'; }
        .lb-row { display: flex; justify-content: space-between; padding: 4px 0; font-size: 1em; }
        .lb-row.me { color: #ff0099; font-weight: bold; }
        .lb-score { font-family: 'Orbitron'; color: #ccc; }

        #drift-ui { position: absolute; top: 15%; width: 100%; text-align: center; }
        #drift-message { 
            font-size: 4em; color: #ff0099; font-weight: 900; 
            text-shadow: 0 0 30px #ff0099; opacity: 0; 
            transition: opacity 0.1s; transform: skewX(-10deg);
        }
        #current-points { font-size: 2.5em; color: #fff; text-shadow: 0 0 15px #00eaff; display:none; margin-top: -10px; }

        /* MENU */
        #menu-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, #1a1a1a 0%, #000 100%);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 20; color: #fff; pointer-events: auto;
        }
        
        h1 { font-size: 5em; margin: 0; background: linear-gradient(to right, #00eaff, #ff0099); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-style: italic; }
        h2 { margin-top: -10px; color: #666; font-size: 1.5em; letter-spacing: 5px; }

        .panel { 
            background: rgba(20,20,20,0.95); padding: 40px; border: 1px solid #444; 
            border-radius: 10px; width: 500px; text-align: center; 
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
        }
        
        input[type="text"] { 
            width: 70%; padding: 15px; font-size: 1.3em; text-align: center; margin: 15px 0;
            background: #000; border: 2px solid #444; color: #fff; font-family: 'Orbitron'; 
            border-radius: 5px; outline: none;
        }
        input:focus { border-color: #00eaff; }
        
        button {
            width: 100%; padding: 15px; margin-top: 10px; font-size: 1.3em; font-weight: bold;
            border: none; cursor: pointer; font-family: 'Orbitron'; color: #000;
            background: #00eaff; transition: 0.2s; border-radius: 5px;
        }
        button:hover { background: #fff; transform: scale(1.02); }
        button.secondary { background: transparent; border: 2px solid #444; color: #888; width: auto; padding: 10px 30px; margin-top: 20px; font-size: 1em; }
        button.secondary:hover { border-color: #fff; color: #fff; }

        #lobby-player-list { margin: 20px 0; text-align: left; background: #111; padding: 10px; border-radius: 5px; }
        .lobby-player { padding: 5px; border-bottom: 1px solid #333; color: #aaa; }
        .lobby-player.ready { color: #00ff00; }

        #id-display { font-size: 3em; color: #ff0099; margin: 10px 0; font-weight: bold; cursor: pointer; }
        
    </style>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>

    <div id="ui-layer">
        <div id="hud">
            <div id="leaderboard">
                <div class="lb-header">TOP DRIFTER</div>
                <div id="lb-content"></div>
            </div>

            <div id="drift-ui">
                <div id="drift-message">DRIFT!</div>
                <div id="current-points">+0</div>
            </div>

            <div id="speedometer">
                <div id="speed-val">0</div>
                <div id="speed-unit">KM/H</div>
            </div>
        </div>
    </div>

    <div id="menu-screen">
        <h1>DRIFT RUSH</h1>
        <h2>V51 ONLINE</h2>
        
        <div id="start-panel" class="panel">
            <input type="text" id="my-name" placeholder="DEIN NAME" maxlength="10" value="Racer">
            <button onclick="createLobby()">LOBBY ERSTELLEN</button>
            <div style="margin:10px; color:#444;">- ODER -</div>
            <button onclick="showJoin()" style="background:#ff0099; color:#fff;">BEITRETEN</button>
        </div>

        <div id="host-panel" class="panel" style="display:none;">
            <div style="color:#aaa;">RAUM NUMMER</div>
            <div id="id-display" onclick="copyId()">Lade...</div>
            <div id="lobby-player-list"><div class="lobby-player ready">1. Du (Host)</div></div>
            <button onclick="hostStartGame()">STARTEN</button>
            <button class="secondary" onclick="location.reload()">ABBRECHEN</button>
        </div>

        <div id="join-panel" class="panel" style="display:none;">
            <div style="color:#aaa;">ID EINGEBEN</div>
            <input type="text" id="join-id" placeholder="1234" maxlength="4" style="font-size:2em; letter-spacing:5px;">
            <button onclick="joinLobby()">VERBINDEN</button>
            <div id="join-status" style="margin-top:10px; color:#ff0099;"></div>
            <button class="secondary" onclick="location.reload()">ZURÜCK</button>
        </div>
    </div>

    <audio id="sfx-drift" loop><source src="https://actions.google.com/sounds/v1/vehicles/skidding.ogg" type="audio/ogg"></audio>

    <script>
        // --- CONFIG ---
        const ID_PREFIX = "dr51-score-v2-"; 
        const PEER_CONFIG = { debug: 1, config: { 'iceServers': [ { url: 'stun:stun.l.google.com:19302' } ] } };
        const PLAYER_COLORS = [0x00eaff, 0xff0099, 0xffff00, 0x00ff00];
        
        // --- GLOBALS ---
        let scene, camera, renderer, clock;
        let myId = null;
        let players = {}; 
        let myCar = null;
        let velocity = new THREE.Vector3();
        let keys = {};
        let particles = [];
        
        // SCORE
        let totalScore = 0;
        let driftSessionScore = 0;

        let skidTimer = 0;
        let lastLeftPos = new THREE.Vector3();
        let lastRightPos = new THREE.Vector3();

        let peer;
        let isHost = false;
        let hostConn = null; 
        let clientConns = {}; 
        let myName = "Player";
        let gameActive = false;

        // --- NETWORK SETUP ---
        function createLobby() {
            myName = document.getElementById('my-name').value || "Host";
            isHost = true;
            document.getElementById('start-panel').style.display = 'none';
            document.getElementById('host-panel').style.display = 'block';
            tryConnectPeer();
        }

        function tryConnectPeer() {
            const numId = Math.floor(1000 + Math.random() * 9000);
            if(peer) peer.destroy();
            peer = new Peer(ID_PREFIX + numId, PEER_CONFIG);
            
            peer.on('open', (id) => {
                myId = id;
                document.getElementById('id-display').innerText = numId;
                players[myId] = { name: myName, score: 0, color: PLAYER_COLORS[0], isMe: true };
                updateLobbyUI();
            });

            peer.on('connection', (conn) => {
                clientConns[conn.peer] = conn;
                conn.on('data', (data) => handleHostData(conn.peer, data));
                conn.on('close', () => {
                    delete clientConns[conn.peer];
                    delete players[conn.peer];
                    broadcast({ type: 'player_left', id: conn.peer });
                    updateLobbyUI();
                });
            });
            peer.on('error', (err) => { if(err.type === 'unavailable-id') setTimeout(tryConnectPeer, 100); });
        }

        function showJoin() {
            myName = document.getElementById('my-name').value || "Gast";
            document.getElementById('start-panel').style.display = 'none';
            document.getElementById('join-panel').style.display = 'block';
        }

        function joinLobby() {
            const inputId = document.getElementById('join-id').value;
            if(inputId.length !== 4) return;
            document.getElementById('join-status').innerText = "Verbinde...";
            if(peer) peer.destroy();
            peer = new Peer(null, PEER_CONFIG);
            peer.on('open', (id) => {
                myId = id;
                hostConn = peer.connect(ID_PREFIX + inputId);
                hostConn.on('open', () => {
                    document.getElementById('join-status').innerText = "Warte auf Host...";
                    hostConn.send({ type: 'join', name: myName });
                });
                hostConn.on('data', (data) => handleClientData(data));
                hostConn.on('close', () => { alert("Verbindung verloren."); location.reload(); });
            });
        }

        function handleHostData(clientId, data) {
            if(data.type === 'join') {
                const slot = Object.keys(players).length;
                if(slot >= 4) return; 
                players[clientId] = { name: data.name, score: 0, color: PLAYER_COLORS[slot], isMe: false };
                broadcastLobbyState();
                updateLobbyUI();
            } else if(data.type === 'update') {
                if(players[clientId]) {
                    players[clientId].pos = data.pos;
                    players[clientId].rot = data.rot;
                    players[clientId].drift = data.drift;
                    players[clientId].accel = data.accel;
                    players[clientId].score = data.score; // Score empfangen
                }
            }
        }

        function hostStartGame() {
            broadcast({ type: 'start_game', allPlayers: players });
            startGame(players);
        }

        function broadcastLobbyState() { broadcast({ type: 'lobby_update', allPlayers: players }); }
        function broadcast(msg) { Object.values(clientConns).forEach(conn => conn.send(msg)); }
        function updateLobbyUI() {
            const list = document.getElementById('lobby-player-list');
            list.innerHTML = "";
            Object.values(players).forEach(p => {
                const div = document.createElement('div');
                div.className = "lobby-player ready";
                div.innerText = p.name;
                list.appendChild(div);
            });
        }

        function handleClientData(data) {
            if(data.type === 'lobby_update') {
                document.getElementById('join-status').innerText = "Lobby: " + Object.keys(data.allPlayers).length + " Spieler";
            } else if(data.type === 'start_game') {
                data.allPlayers[myId].isMe = true;
                startGame(data.allPlayers);
            } else if(data.type === 'world_update') {
                Object.keys(data.updates).forEach(id => {
                    if(players[id]) {
                        players[id].score = data.updates[id].score; // Update Score im Client
                        
                        if(id !== myId && players[id].mesh) {
                            const info = data.updates[id];
                            players[id].mesh.position.lerp(info.pos, 0.3);
                            let diff = info.rot - players[id].mesh.rotation.y;
                            while(diff > Math.PI) diff -= Math.PI*2;
                            while(diff < -Math.PI) diff += Math.PI*2;
                            players[id].mesh.rotation.y += diff * 0.3;
                            
                            if(info.drift) createDriftSmoke(players[id].mesh.position);
                            if(info.accel) createExhaust(players[id].mesh);
                        }
                    }
                });
                renderLeaderboard();
            }
        }

        function renderLeaderboard() {
            const sorted = Object.values(players).sort((a,b) => b.score - a.score);
            let html = "";
            sorted.forEach((p, idx) => {
                const cls = p.isMe ? "lb-row me" : "lb-row";
                html += `<div class="${cls}">
                    <span>${idx+1}. ${p.name}</span>
                    <span class="lb-score">${Math.floor(p.score)}</span>
                </div>`;
            });
            document.getElementById('lb-content').innerHTML = html;
        }

        // --- GAME ENGINE ---
        function startGame(playerList) {
            players = playerList;
            gameActive = true;
            document.getElementById('menu-screen').style.display = 'none';
            document.getElementById('hud').style.display = 'block';
            
            init3D();
            
            Object.keys(players).forEach((id, index) => {
                const p = players[id];
                const car = createCarMesh(p.color);
                car.position.set( (index-1.5) * 6, 0.5, 0 ); 
                scene.add(car);
                p.mesh = car;
                addNametag(car, p.name);
                if(p.isMe) {
                    myCar = car;
                    lastLeftPos.copy(car.position);
                    lastRightPos.copy(car.position);
                }
            });

            animate();
            
            setInterval(() => {
                if(isHost) {
                    const updates = {};
                    Object.keys(players).forEach(id => {
                        if(players[id].mesh || players[id].isMe) {
                            updates[id] = {
                                pos: players[id].isMe ? myCar.position : players[id].pos, 
                                rot: players[id].isMe ? myCar.rotation.y : players[id].rot,
                                drift: players[id].drift,
                                accel: players[id].accel,
                                score: players[id].score
                            };
                        }
                    });
                    broadcast({ type: 'world_update', updates: updates });
                    renderLeaderboard();
                } else {
                    if(myCar) {
                        hostConn.send({
                            type: 'update',
                            pos: myCar.position,
                            rot: myCar.rotation.y,
                            drift: (Math.abs(velocity.dot(new THREE.Vector3(1,0,0).applyQuaternion(myCar.quaternion))) > 5),
                            accel: keys['w'],
                            score: totalScore
                        });
                    }
                }
            }, 50);
        }

        function init3D() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x050505);
            scene.fog = new THREE.FogExp2(0x050505, 0.002);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
            
            renderer = new THREE.WebGLRenderer({antialias: true});
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.body.appendChild(renderer.domElement);

            const amb = new THREE.AmbientLight(0x222222);
            scene.add(amb);
            const dir = new THREE.DirectionalLight(0xffffff, 0.8);
            dir.position.set(50, 100, 50);
            dir.castShadow = true;
            dir.shadow.mapSize.width = 2048; dir.shadow.mapSize.height = 2048;
            scene.add(dir);

            createMap();
            
            clock = new THREE.Clock();
            
            window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
            window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth/window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        function createMap() {
            const canvas = document.createElement('canvas');
            canvas.width = 512; canvas.height = 512;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#111'; ctx.fillRect(0,0,512,512); 
            for(let i=0; i<10000; i++) {
                ctx.fillStyle = Math.random()>0.5 ? '#1a1a1a' : '#0a0a0a';
                ctx.fillRect(Math.random()*512, Math.random()*512, 2, 2);
            }
            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
            tex.repeat.set(100, 100);
            
            const floor = new THREE.Mesh(new THREE.PlaneGeometry(1000, 1000), new THREE.MeshStandardMaterial({ map: tex, roughness: 0.8, metalness: 0.1 }));
            floor.rotation.x = -Math.PI/2;
            floor.receiveShadow = true;
            scene.add(floor);

            const podium = new THREE.Mesh(new THREE.CylinderGeometry(5, 6, 2, 32), new THREE.MeshStandardMaterial({color:0x333}));
            podium.position.set(0, 1, -50);
            scene.add(podium);
            
            // ZÖCHI STATUE MIT REIFEN
            const statue = createCarMesh(0x0000ff);
            statue.position.set(0, 3, -50);
            statue.rotation.set(-0.2, 0.5, 0.2);
            
            // Trick: Lichter ausblenden, aber Räder (Groups) anlassen
            statue.traverse(child => {
                if (child.name === "lights") child.visible = false;
            });
            scene.add(statue);
            
            createTextLabel("ZÖCHI", 0, 7, -50);
            
            for(let i=0; i<60; i++) {
                const h = 20 + Math.random()*60;
                const building = new THREE.Mesh(
                    new THREE.BoxGeometry(10+Math.random()*20, h, 10+Math.random()*20),
                    new THREE.MeshStandardMaterial({color:0x111111, emissive:0x050505})
                );
                const angle = Math.random() * Math.PI * 2;
                const dist = 80 + Math.random() * 200;
                building.position.set(Math.cos(angle)*dist, h/2, Math.sin(angle)*dist);
                scene.add(building);
            }
        }

        function createCarMesh(color) {
            const grp = new THREE.Group();
            
            const body = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.7, 4.4), new THREE.MeshStandardMaterial({color: color, metalness: 0.6, roughness: 0.2}));
            body.position.y = 0.7; body.castShadow = true;
            grp.add(body);
            const cab = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.6, 2.2), new THREE.MeshStandardMaterial({color: 0x111111}));
            cab.position.set(0, 1.3, -0.2);
            grp.add(cab);
            
            // Lichter Container
            const lights = new THREE.Group();
            lights.name = "lights"; // WICHTIG für Zöchi Filter
            
            const h1 = new THREE.SpotLight(0xffffff, 2, 60, 0.5, 0.5, 1);
            h1.position.set(0.8, 1, 2); h1.target.position.set(0.8, 0, 10);
            lights.add(h1); lights.add(h1.target);
            const h1m = new THREE.Mesh(new THREE.CircleGeometry(0.15,16), new THREE.MeshBasicMaterial({color:0xffffff}));
            h1m.position.set(0.8, 0.8, 2.21); h1m.rotation.y = 0; lights.add(h1m); 

            const h2 = new THREE.SpotLight(0xffffff, 2, 60, 0.5, 0.5, 1);
            h2.position.set(-0.8, 1, 2); h2.target.position.set(-0.8, 0, 10);
            lights.add(h2); lights.add(h2.target);
            const h2m = new THREE.Mesh(new THREE.CircleGeometry(0.15,16), new THREE.MeshBasicMaterial({color:0xffffff}));
            h2m.position.set(-0.8, 0.8, 2.21); lights.add(h2m);

            const t1 = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.2, 0.1), new THREE.MeshBasicMaterial({color:0xff0000}));
            t1.position.set(0.8, 0.9, -2.2); lights.add(t1);
            const t2 = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.2, 0.1), new THREE.MeshBasicMaterial({color:0xff0000}));
            t2.position.set(-0.8, 0.9, -2.2); lights.add(t2);
            
            const ex1 = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 0.5), new THREE.MeshStandardMaterial({color:0x333}));
            ex1.rotation.x = Math.PI/2; ex1.position.set(0.5, 0.4, -2.2); lights.add(ex1);
            const ex2 = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 0.5), new THREE.MeshStandardMaterial({color:0x333}));
            ex2.rotation.x = Math.PI/2; ex2.position.set(-0.5, 0.4, -2.2); lights.add(ex2);

            grp.add(lights);

            const wGeo = new THREE.CylinderGeometry(0.4, 0.4, 0.35, 24);
            const wMat = new THREE.MeshStandardMaterial({color: 0x111111});
            const rimGeo = new THREE.CylinderGeometry(0.25, 0.25, 0.36, 16);
            const rimMat = new THREE.MeshStandardMaterial({color: 0xcccccc, metalness: 0.9, roughness:0.1}); 

            [{x:1.2, z:1.4}, {x:-1.2, z:1.4}, {x:1.2, z:-1.4}, {x:-1.2, z:-1.4}].forEach(p => {
                const wGrp = new THREE.Group();
                const tire = new THREE.Mesh(wGeo, wMat);
                tire.rotation.z = Math.PI/2;
                wGrp.add(tire);
                const rim = new THREE.Mesh(rimGeo, rimMat);
                rim.rotation.z = Math.PI/2;
                wGrp.add(rim);
                wGrp.position.set(p.x, 0.4, p.z);
                wGrp.castShadow = true;
                grp.add(wGrp);
            });

            return grp;
        }

        function createTextLabel(text, x, y, z) {
            const cvs = document.createElement('canvas'); const ctx = cvs.getContext('2d');
            cvs.width=512; cvs.height=128;
            ctx.fillStyle="rgba(0,0,0,0)"; ctx.fillRect(0,0,512,128);
            ctx.font="bold 80px Arial"; ctx.fillStyle="#00eaff"; ctx.textAlign="center"; ctx.fillText(text, 256, 100);
            const spr = new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(cvs)}));
            spr.scale.set(10, 2.5, 1); spr.position.set(x,y,z);
            scene.add(spr);
        }

        function addNametag(parent, name) {
            const cvs = document.createElement('canvas'); const ctx = cvs.getContext('2d');
            cvs.width = 256; cvs.height = 64;
            ctx.fillStyle = "rgba(0,0,0,0.5)"; ctx.fillRect(0,0,256,64);
            ctx.fillStyle = "#fff"; ctx.font = "bold 40px Arial"; 
            ctx.textAlign = "center"; ctx.fillText(name, 128, 45);
            const spr = new THREE.Sprite(new THREE.SpriteMaterial({map: new THREE.CanvasTexture(cvs)}));
            spr.position.set(0, 3, 0); spr.scale.set(4, 1, 1);
            parent.add(spr);
        }

        function createDriftSmoke(pos) {
            const geo = new THREE.PlaneGeometry(0.6, 0.6);
            const mat = new THREE.MeshBasicMaterial({color:0x666666, transparent:true, opacity:0.4, side:THREE.DoubleSide});
            const p = new THREE.Mesh(geo, mat);
            p.position.copy(pos);
            p.position.y = 0.1;
            p.rotation.x = -Math.PI/2;
            p.userData = { life: 1.0, type: 'smoke' };
            scene.add(p);
            particles.push(p);
        }

        function createExhaust(carObj) {
            const offset = new THREE.Vector3(0, 0.4, -2.5).applyQuaternion(carObj.quaternion);
            const pos = carObj.position.clone().add(offset);
            const geo = new THREE.PlaneGeometry(0.3, 0.3);
            const mat = new THREE.MeshBasicMaterial({color: (Math.random()>0.5 ? 0xffaa00 : 0xff4400), transparent:true, opacity:0.8, side:THREE.DoubleSide});
            const p = new THREE.Mesh(geo, mat);
            p.position.copy(pos);
            p.lookAt(camera.position); 
            p.userData = { life: 0.3, type: 'fire' };
            scene.add(p);
            particles.push(p);
        }

        function updateSkidmarks() {
            skidTimer -= 0.05;
            if(!myCar) return;
            const isDrifting = Math.abs(velocity.dot(new THREE.Vector3(1,0,0).applyQuaternion(myCar.quaternion))) > 5;
            if(isDrifting && skidTimer <= 0) {
                const fwd = new THREE.Vector3(0,0,1).applyQuaternion(myCar.quaternion);
                const right = new THREE.Vector3(1,0,0).applyQuaternion(myCar.quaternion);
                const lPos = myCar.position.clone().add(right.clone().multiplyScalar(-1.2)).add(fwd.clone().multiplyScalar(-1.4));
                const rPos = myCar.position.clone().add(right.clone().multiplyScalar(1.2)).add(fwd.clone().multiplyScalar(-1.4));
                lPos.y = 0.02; rPos.y = 0.02;
                if(lastLeftPos.distanceTo(lPos) > 0.5) {
                    const mat = new THREE.LineBasicMaterial({color:0x000000, opacity:0.3, transparent:true});
                    const geoL = new THREE.BufferGeometry().setFromPoints([lastLeftPos.clone(), lPos.clone()]);
                    scene.add(new THREE.Line(geoL, mat));
                    const geoR = new THREE.BufferGeometry().setFromPoints([lastRightPos.clone(), rPos.clone()]);
                    scene.add(new THREE.Line(geoR, mat));
                    lastLeftPos.copy(lPos); lastRightPos.copy(rPos);
                }
                skidTimer = 0.05;
            } else if (!isDrifting) {
                const fwd = new THREE.Vector3(0,0,1).applyQuaternion(myCar.quaternion);
                const right = new THREE.Vector3(1,0,0).applyQuaternion(myCar.quaternion);
                lastLeftPos = myCar.position.clone().add(right.clone().multiplyScalar(-1.2)).add(fwd.clone().multiplyScalar(-1.4));
                lastRightPos = myCar.position.clone().add(right.clone().multiplyScalar(1.2)).add(fwd.clone().multiplyScalar(-1.4));
            }
        }

        function updatePhysics(dt) {
            if(!myCar) return;
            if(!players[myId]) return;

            let drive = 0;
            if(keys['w']) {
                drive = 150;
                if(Math.random()>0.8) createExhaust(myCar); 
            }
            if(keys['s']) drive = -50;
            let steer = 0;
            if(keys['a']) steer = 1;
            if(keys['d']) steer = -1;
            
            const fwd = new THREE.Vector3(0,0,1).applyQuaternion(myCar.quaternion);
            const right = new THREE.Vector3(1,0,0).applyQuaternion(myCar.quaternion);
            
            velocity.add(fwd.multiplyScalar(drive * dt));
            velocity.multiplyScalar(0.98); 
            
            const speed = velocity.length();
            let grip = 0.95;
            if(keys[' ']) { grip = 0.1; } 
            
            const fwdVel = velocity.dot(fwd);
            const sideVel = velocity.dot(right);
            
            velocity.add(right.multiplyScalar(-sideVel * grip * 5.0 * dt));
            myCar.position.add(velocity.clone().multiplyScalar(dt));
            myCar.rotation.y += steer * 2.8 * dt * (speed/15);
            
            // SCORE BERECHNUNG
            const driftAngle = Math.abs(sideVel);
            const driftMsg = document.getElementById('drift-message');
            const pointsMsg = document.getElementById('current-points');
            
            if(driftAngle > 5 && speed > 5) {
                players[myId].drift = true;
                
                // Punkte hinzufügen
                const points = Math.floor(driftAngle * speed * dt * 0.5);
                driftSessionScore += points;
                totalScore += points;
                
                // UI Update
                driftMsg.style.opacity = 1;
                pointsMsg.style.display = 'block';
                pointsMsg.innerText = "+" + driftSessionScore;
                
                // Lokalen Player Score updaten
                players[myId].score = totalScore;

                if(Math.random()>0.5) createDriftSmoke(myCar.position);
            } else {
                players[myId].drift = false;
                driftMsg.style.opacity = 0;
                pointsMsg.style.display = 'none';
                driftSessionScore = 0;
            }
            
            players[myId].accel = keys['w']; 
            
            updateSkidmarks();
            document.getElementById('speed-val').innerText = Math.floor(speed*3);
        }

        function animate() {
            requestAnimationFrame(animate);
            if(!gameActive) return;
            const dt = Math.min(clock.getDelta(), 0.1);
            updatePhysics(dt);
            
            for(let i=particles.length-1; i>=0; i--) {
                const p = particles[i];
                p.userData.life -= dt;
                
                if(p.userData.type === 'smoke') {
                    p.material.opacity = p.userData.life * 0.4;
                    p.scale.multiplyScalar(1.05);
                    p.position.y += dt;
                } else {
                    p.material.opacity = p.userData.life * 2;
                    p.position.y += dt*2;
                }

                if(p.userData.life <= 0) {
                    scene.remove(p);
                    particles.splice(i,1);
                }
            }

            if(myCar) {
                const off = new THREE.Vector3(0, 5, -12);
                off.applyQuaternion(myCar.quaternion);
                const target = myCar.position.clone().add(off);
                camera.position.lerp(target, 0.1);
                camera.lookAt(myCar.position.clone().add(new THREE.Vector3(0,0,10).applyQuaternion(myCar.quaternion)));
            }
            renderer.render(scene, camera);
        }

        function copyId() {
            const id = document.getElementById('id-display').innerText;
            navigator.clipboard.writeText(id);
            alert("ID kopiert!");
        }
    </script>
